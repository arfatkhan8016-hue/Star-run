<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML5 3D Character Generator</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; }
        canvas { display: block; }
        #exportBtn {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 12px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <button id="exportBtn">Export as .GLB</button>

    <!-- Three.js aur GLTFExporter Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // 1. Scene, Camera aur Renderer Set Up
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x222222);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.5, 3);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);

        // 2. Lighting (PBR Realism Ke Liye)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(5, 10, 7.5);
        scene.add(dirLight);

        // 3. Custom 3D Character Group (Humanoid Structure)
        const characterGroup = new THREE.Group();

        // Realistic PBR Material
        const bodyMaterial = new THREE.MeshStandardMaterial({
            color: 0x2266aa,
            roughness: 0.3,
            metalness: 0.2
        });

        const headMaterial = new THREE.MeshStandardMaterial({
            color: 0xffcc99,
            roughness: 0.5
        });

        // Head (Aankhon/Face ke saath)
        const headGeometry = new THREE.SphereGeometry(0.25, 32, 32);
        const head = new THREE.Mesh(headGeometry, headMaterial);
        head.position.y = 1.6;
        characterGroup.add(head);

        // Torso (Body)
        const torsoGeometry = new THREE.CylinderGeometry(0.3, 0.2, 0.8, 32);
        const torso = new THREE.Mesh(torsoGeometry, bodyMaterial);
        torso.position.y = 1.0;
        characterGroup.add(torso);

        // Left Arm
        const armGeometry = new THREE.CylinderGeometry(0.08, 0.07, 0.6, 16);
        const leftArm = new THREE.Mesh(armGeometry, bodyMaterial);
        leftArm.position.set(-0.4, 1.0, 0);
        characterGroup.add(leftArm);

        // Right Arm
        const rightArm = new THREE.Mesh(armGeometry, bodyMaterial);
        rightArm.position.set(0.4, 1.0, 0);
        characterGroup.add(rightArm);

        // Left Leg
        const legGeometry = new THREE.CylinderGeometry(0.1, 0.08, 0.7, 16);
        const leftLeg = new THREE.Mesh(legGeometry, bodyMaterial);
        leftLeg.position.set(-0.18, 0.35, 0);
        characterGroup.add(leftLeg);

        // Right Leg
        const rightLeg = new THREE.Mesh(legGeometry, bodyMaterial);
        rightLeg.position.set(0.18, 0.35, 0);
        characterGroup.add(rightLeg);

        scene.add(characterGroup);

        // 4. Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            characterGroup.rotation.y += 0.005; // Character slow rotate hoga
            renderer.render(scene, camera);
        }
        animate();

        // 5. Code Se .GLB Export Karne Ka Function
        document.getElementById('exportBtn').addEventListener('click', function () {
            const exporter = new THREE.GLTFExporter();
            exporter.parse(
                characterGroup,
                function (gltf) {
                    const blob = new Blob([gltf], { type: 'application/octet-stream' });
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = 'my_custom_character.glb';
                    link.click();
                },
                { binary: true } // .glb ke liye binary mode active
            );
        });

        // Window Resize Handle
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
